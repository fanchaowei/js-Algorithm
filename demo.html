<script>
  var moveZeroes = function (nums) {
    if (nums.length <= 1) {
      return nums
    }

    let slow = 0
    let fast = 0

    while (fast <= nums.length - 1) {
      if (nums[fast]) {
        nums[slow] = nums[fast]
        slow++
        fast++
      } else {
        fast++
      }
    }

    while (slow <= nums.length - 1) {
      nums[slow] = 0
      slow++
    }

    return nums
  }

  moveZeroes([0, 1, 0, 3, 12])

</script>
